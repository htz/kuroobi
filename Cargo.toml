[package]
name = "kuroobi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ultra-fast Reversi bitboard library using 2x uint64"

[dependencies]
rand = { version = "0.8", optional = true }
libc = "0.2"

[dev-dependencies]
rand = "0.8"
criterion = "0.5"

[features]
default = []
random = ["rand"]
# Count move-ordering and ETC probes as nodes, the way Edax does, so node
# totals are comparable with `edax -solve`. Costs a few percent of search time.
node-accounting = []
# Sample where search time goes, by empty count and phase. Measurement only.
layer-profile = []
# Force the scalar NNUE accumulator path even on aarch64 (to measure the
# NEON speedup). Off by default; NEON is used automatically on aarch64.
nnue-scalar = []
# Accumulator width. Default (no feature) is H=32. Pick one at most; they are
# mutually exclusive and a weight file is only loadable by the width that
# wrote it. Build a second width beside the default with its own target dir:
#   cargo build --release --features h64 --target-dir target-h64
h16 = []
h64 = []
h128 = []
# Independent copies of the feature transformer, one per slice of the game.
# Default (no feature) is a single shared copy. Buckets add parameters without
# adding row reads, and cost only the footprint; see `nnue::FT_BUCKETS`.
# A weight file records the whole table, so widths and bucket counts are not
# interchangeable -- build each beside the default with its own target dir.
ftb2 = []
ftb4 = []
ftb6 = []

[[bench]]
name = "core"
harness = false

[profile.release]
# The search is one hot call graph spread across modules, so cross-crate
# inlining matters: link-time optimization plus a single codegen unit let
# the optimizer see all of it at once.
lto = "fat"
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1
