[package]
name = "kuroobi"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Ultra-fast Reversi (Othello) bitboard library using 2x uint64"

[dependencies]
rand = { version = "0.8", optional = true }

[dev-dependencies]
rand = "0.8"
criterion = "0.5"

[features]
default = []
random = ["rand"]

[[bench]]
name = "core"
harness = false

[profile.bench]
lto = true
