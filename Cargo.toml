[package]
name = "kuroobi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ultra-fast Reversi bitboard library using 2x uint64"

[dependencies]
rand = { version = "0.8", optional = true }
libc = "0.2"
# GPU training path (`gpu` feature): one code base for Metal and Vulkan.
wgpu = { version = "29", optional = true, default-features = false, features = ["metal", "vulkan", "wgsl", "std"] }
bytemuck = { version = "1", optional = true }

[dev-dependencies]
rand = "0.8"
criterion = "0.5"

[features]
default = []
# Train the stacked-read-out model on the GPU (`nnue_train --gpu`).
gpu = ["dep:wgpu", "dep:bytemuck"]
# Read the solver's tuning knobs from environment variables at first use
# instead of compiling their defaults in. Sweeps need this; the default
# build folds the knobs to constants so dead regimes cost nothing.
tunable = []
random = ["rand"]
# Count move-ordering and ETC probes as nodes, the wider convention, so node
# totals are comparable with engines that use it. Costs a few percent of
# search time.
node-accounting = []
# Sample where search time goes, by empty count and phase. Measurement only.
layer-profile = []
# Force the scalar NNUE accumulator path even on aarch64 (to measure the
# NEON speedup). Off by default; NEON is used automatically on aarch64.
nnue-scalar = []

[[bench]]
name = "core"
harness = false

[profile.release]
# The search is one hot call graph spread across modules, so cross-crate
# inlining matters: link-time optimization plus a single codegen unit let
# the optimizer see all of it at once.
lto = "fat"
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1

