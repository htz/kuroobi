[package]
name = "gui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kuroobi GUI (Tauri)"
default-run = "kuroobi-gui"

[[bin]]
name = "kuroobi-gui"
path = "src/main.rs"

[dependencies]
kuroobi = { path = "../..", default-features = false }
ggs = { path = "../ggs" }
flipsight = { path = "../flipsight" }
play = { path = "../play" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sys-locale = "0.3.2"

# Resident memory size lookup; libc's mach APIs are deprecated
[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
objc2 = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }
