[package]
name = "flipsight"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A FlipSight (othelloclub.com) bot client for kuroobi: standard 8x8 games"

[[bin]]
name = "kuroobi-flipsight"
path = "src/main.rs"

[dependencies]
kuroobi = { path = "../..", default-features = false }
play = { path = "../play" }
ggs = { path = "../ggs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
libc = "0.2"
