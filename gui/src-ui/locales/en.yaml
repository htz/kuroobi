# KUROOBI UI strings (English; the fallback for every language).
#
# Keys are dotted paths grouped by screen. Every user-visible string
# lives here — no implementation file carries display text.
#
# `backend.*` is the subset the Rust side renders itself (OS
# notifications, native file dialogs); the frontend pushes it over IPC.
# `err.*` are the keys Rust commands return in place of messages.
