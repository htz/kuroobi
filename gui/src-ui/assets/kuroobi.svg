<svg xmlns="http://www.w3.org/2000/svg" viewBox="11.5 9.5 311 45" width="311" height="45" role="img" aria-label="KUROOBI">
  <!-- All coordinates are outline-based. Stroke width is 8, so at endpoints and
       at the extremes of horizontal lines and arcs the centre line sits 4 inside
       (a round cap bulges 4 in every direction from the endpoint).
       Every glyph outline fits in y 10-54 (height 44), so the top and bottom
       lines align.
       The viewBox is the glyph outline + 0.5 (margins are the caller's choice).
       A tight fit lets rounding at draw time shave the round ends off - 0.5 is
       invisible on screen but prevents the clipping.
       Outline widths: K U = 36, R B = 32 (glyphs that stick out on only one side
       of the stem are narrower), letter spacing 13.
       O alone is 44 because it doubles as a stone. -->
  <g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- K 12-48 -->
    <path d="M16 14 V50"/>
    <path d="M44 14 L20 32 L44 50"/>
    <!-- U 61-97: the arc bottom is centre line 50 (outline 54) -->
    <path d="M65 14 V36 A14 14 0 0 0 93 36 V14"/>
    <!-- R 110-142: stem and bowl are one path so the shoulder stays round.
         The leg starts at the centre of the bowl's bottom edge (keeps the round
         cap from peeking inside the arc) and ends at the bowl's right edge (both
         outlines end at 142) -->
    <path d="M114 50 V14 H127 A11 11 0 0 1 127 36 H114"/>
    <path d="M127 36 L138 50"/>
    <!-- O 155-199: white stone (r18 + half the stroke width = outline 44) -->
    <circle cx="177" cy="32" r="18"/>
    <!-- O 212-256: black stone (the same circle, filled) -->
    <circle cx="234" cy="32" r="18" fill="currentColor"/>
    <!-- B 269-301: both bowls share a radius (9); drawn as one path with the stem -->
    <path d="M273 32 H288 A9 9 0 0 1 288 50 H273 V14 H288 A9 9 0 0 1 288 32 H273"/>
    <!-- I 314-322 -->
    <path d="M318 14 V50"/>
  </g>
</svg>
