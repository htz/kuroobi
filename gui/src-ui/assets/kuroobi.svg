<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 334 64" width="334" height="64" role="img" aria-label="KUROOBI">
  <!-- 座標はすべて「線の外形」基準。線幅 8 なので、端点や水平線・円弧の頂点では
       中心線を 4 内側に置く (丸い端は端点から全方向へ 4 膨らむ)。
       全文字の外形が y 10-54 (高さ 44) に収まり、上下のラインが揃う。
       外形幅は K U = 36、R B = 32 (縦線から片側だけ出る字は狭くする)、字間は 13。
       O だけ 44 なのは石として置くため。 -->
  <g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- K 12-48 -->
    <path d="M16 14 V50"/>
    <path d="M44 14 L20 32 L44 50"/>
    <!-- U 61-97: 弧の底は中心線 50 (外形 54) -->
    <path d="M65 14 V36 A14 14 0 0 0 93 36 V14"/>
    <!-- R 110-142: 縦線とボウルは 1 本に繋いで肩を丸める。
         脚の始点はボウル下辺の中心に置き (丸い端が弧の内側へ覗かない)、
         終点はボウルの右端に合わせる (外形右端がどちらも 142) -->
    <path d="M114 50 V14 H127 A11 11 0 0 1 127 36 H114"/>
    <path d="M127 36 L138 50"/>
    <!-- O 155-199: 白石 (r18 + 線幅の半分で外形 44) -->
    <circle cx="177" cy="32" r="18"/>
    <!-- O 212-256: 黒石 (同じ円を塗る) -->
    <circle cx="234" cy="32" r="18" fill="currentColor"/>
    <!-- B 269-301: 上下のボウルは同径 (半径 9)。縦線ごと 1 本に繋ぐ -->
    <path d="M273 32 H288 A9 9 0 0 1 288 50 H273 V14 H288 A9 9 0 0 1 288 32 H273"/>
    <!-- I 314-322 -->
    <path d="M318 14 V50"/>
  </g>
</svg>
