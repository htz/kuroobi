<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Kuroobi</title><link rel="stylesheet" href="./style.css">
</head>
<body oncontextmenu="return false">

  <div id="main">
    <div id="board-wrap"><svg id="board" viewBox="0 0 880 880"></svg></div>
    <div class="card" id="graph-card">
      <div class="row" style="align-items:center">
        <label class="field" style="flex:1; margin:0">評価値グラフ (黒視点)</label>
        <button class="btn small" id="btn-graph">更新</button>
      </div>
      <svg id="graph" viewBox="0 0 800 190"></svg>
    </div>
  </div>
  <div id="panel">
    <div class="panel-head">
      <h1>KUROOBI</h1>
      <button class="btn icon ghost" id="btn-files" title="設定" aria-label="設定">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.36.4.66.73.86.3.18.65.28 1 .28H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <div class="card">
      <div class="score">
        <span class="side" id="score-b"><i class="disc b"></i><span id="nb">2</span></span>
        <span class="vs">—</span>
        <span class="side" id="score-w"><span id="nw">2</span><i class="disc w"></i></span>
      </div>
      <!-- 一局を通してどちらがどれだけ考えたか -->
      <div class="think-time" id="think-time" hidden>
        <span class="side"><i class="disc b"></i><span id="tb">0.0 秒</span></span>
        <span class="vs">思考時間</span>
        <span class="side"><span id="tw">0.0 秒</span><i class="disc w"></i></span>
      </div>
      <div id="result"></div>
    </div>

    <div class="card">
      <div>
        <label class="field">モード</label>
        <div class="seg" id="app-mode">
          <button data-v="vs" class="active">対局</button>
          <button data-v="study">検討</button>
        </div>
      </div>
      <div id="side-row">
        <label class="field">エンジンの担当</label>
        <div class="seg" id="mode">
          <button data-v="black">黒</button>
          <button data-v="white" class="active">白</button>
          <button data-v="both" title="エンジン同士で打たせる">両方</button>
          <button data-v="off" title="人が両方を打つ">なし</button>
        </div>
      </div>
      <div>
        <label class="field">強さ</label>
        <div class="selwrap"><select id="level"></select></div>
      </div>
      <div id="book-row">
        <label class="field">定石 <span class="hint-inline" id="book-note"></span></label>
        <div class="seg" id="use-book">
          <button data-v="on" class="active">使う</button>
          <button data-v="off">使わない</button>
        </div>
      </div>
      <div class="row" id="custom-row" style="display:none">
        <div>
          <label class="field">深さ</label>
          <div class="selwrap"><select id="depth"></select></div>
        </div>
        <div>
          <label class="field">読切</label>
          <div class="selwrap"><select id="solve"></select></div>
        </div>
        <div>
          <label class="field">選択読み</label>
          <div class="selwrap"><select id="band"></select></div>
        </div>
      </div>
    </div>

    <div class="card">
      <button class="btn primary" id="btn-start">▶ 対局開始</button>
      <div class="row" id="game-btns">
        <button class="btn" id="btn-new">新規対局</button>
        <button class="btn" id="btn-undo">待った</button>
      </div>
      <div>
        <label class="field">評価値を表示 (全合法手を自動採点)</label>
        <div class="seg" id="auto-hint">
          <button data-v="off" class="active">オフ</button>
          <button data-v="on">オン</button>
        </div>
      </div>
      <div id="eval"></div>
      <div id="status"></div>
    </div>

    <div>
      <div class="row" style="align-items:center; margin-bottom:4px">
        <label class="field" style="flex:1; margin:0">棋譜 <span style="color:var(--gold)">|</span>定石 <span style="color:var(--accent)">|</span>探索</label>
        <button class="btn small" id="btn-save">保存</button>
        <button class="btn small" id="btn-load">読込</button>
      </div>
      <div id="kifu"></div>
    </div>
  </div>

  <div id="paste-modal" hidden>
    <div class="box">
      <label class="field" style="margin:0">棋譜の読み込み — f5d6… 形式を貼り付け (手番号・空白入りでも可)</label>
      <textarea id="paste-text" placeholder="f5d6c3d3c4f4f3e3e2…"></textarea>
      <div class="row">
        <button class="btn" id="paste-file">ファイルから…</button>
        <button class="btn primary" id="paste-ok">読み込む</button>
        <button class="btn" id="paste-cancel">キャンセル</button>
      </div>
    </div>
  </div>
<script type="module" src="./js/main.ts"></script>
<div class="modal" id="files-modal" hidden>
  <div class="card box wide">
    <h2>設定</h2>
    <div class="settings-section">
      <div class="settings-title">エンジンが使うファイル</div>
      <p class="hint">指定しなければ <code>weights/</code> を上へ辿って探します。
        個別に選ぶと、そのファイルだけを差し替えます。変更は次の思考から効きます。</p>
      <div id="files-list"></div>
    </div>
    <div class="row actions">
      <button class="btn ghost" id="files-close">閉じる</button>
    </div>
  </div>
</div>
</body>
</html>
