# エンジン本体とはビルドを完全に分離する (独立ワークスペース)。
# root での cargo build/test は GUI と tauri 依存を一切巻き込まない。
[workspace]

[package]
name = "kuroobi-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kuroobi の GUI (Tauri)"

[dependencies]
kuroobi = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# GUI のデバッグ実行でも探索本体だけは最適化する (エンジンの速度が UX に直結)
[profile.dev.package.kuroobi]
opt-level = 3
