# Build is fully separated from the engine (independent workspace).
# cargo build/test at the root pulls in neither the GUI nor any tauri dependency.
[workspace]

[package]
name = "kuroobi-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kuroobi GUI (Tauri)"

[dependencies]
kuroobi = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sys-locale = "0.3.2"

# Resident memory size lookup; libc's mach APIs are deprecated
[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Optimize the search even in GUI debug builds (engine speed is felt directly in the UI)
[profile.dev.package.kuroobi]
opt-level = 3
