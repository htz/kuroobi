<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>FlipSight · Bots</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="kuroobi-tokens.css">
<link rel="stylesheet" href="ds/kuroobiui/components/bundle.css">
<script src="ds/kuroobiui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
x-import{display:contents}
@media (max-width:1040px){.k-nav-ov .k-nav-label{display:none}.k-nav-ov .k-nav-row{justify-content:center;padding:0}.k-nav-ov .k-nav-section{display:none}}
.k-scroll{overflow-y:scroll!important}
.k-scroll::-webkit-scrollbar-track{background:var(--track);border-radius:9px}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-4)/1.6 var(--ff)}
a{color:var(--accent)}a:hover{color:var(--text)}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 100vh; min-height: 480px; background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff); overflow: hidden">
<x-import style="display: contents" component-from-global-scope="KuroobiUI.AppFrame">
<x-import component-from-global-scope="KuroobiUI.WindowBar" title="ボット"></x-import>
<x-import style="display: contents" component-from-global-scope="KuroobiUI.Body">
<div style="position: relative; flex: none; display: flex">
<x-import style="display: contents" component-from-global-scope="KuroobiUI.Nav" items="{{navLocal}}" ggs-items="{{ggsItems}}" conn="offline" active="fs-bots"></x-import>
<div class="k-nav-ov" style="position: absolute; left: 0; right: 1px; top: 216px; padding: 0 var(--sp-2); display: flex; flex-direction: column; gap: 1px">
<div class="k-nav-section" style="margin: var(--sp-4) 0 6px; padding: 0 10px; align-items: center; gap: var(--sp-2); font-size: var(--fs-7); font-weight: 600; letter-spacing: .1em; color: var(--sub)"><x-import component-from-global-scope="KuroobiUI.Dot" tone="ok"></x-import>FlipSight</div>
<sc-for list="{{fsItems}}" as="i" hint-placeholder-count="4">
<x-import component-from-global-scope="KuroobiUI.NavRow" item="{{i.item}}" active="{{i.on}}"></x-import>
</sc-for>
</div>
<div class="k-nav-ov" style="position: absolute; left: 0; right: 1px; bottom: 0; padding: var(--sp-2); border-top: 1px solid var(--border); background: var(--panel)">
<button type="button" class="k-nav-row k-row" aria-current="false" style="width: 100%; height: var(--h-field); display: flex; align-items: center; gap: var(--sp-3); border: 0; border-radius: var(--r-2); font: inherit; font-size: var(--fs-4); background: transparent; color: var(--text); font-weight: 400"><span style="flex: none; display: grid; place-items: center"><x-import component-from-global-scope="KuroobiUI.Icon" name="prefs"></x-import></span><span class="k-nav-label">設定</span></button>
</div>
</div>
<x-import style="display: contents" component-from-global-scope="KuroobiUI.Main">
<x-import style="display: contents" component-from-global-scope="KuroobiUI.Toolbar">
<!-- Which of this Mac's bots: the rating and the challenge buttons are that bot's. Taking challenges is set in My bots -->
<x-import component-from-global-scope="KuroobiUI.Select" value="KUROOBI" options="{{mineOpts}}" width="{{mineW}}" title="ボット"></x-import>
<div style="margin-left: auto; display: flex; align-items: center; gap: var(--sp-2); white-space: nowrap">
<x-import component-from-global-scope="KuroobiUI.Button" variant="ghost">更新</x-import>
</div>
</x-import>
<div style="flex: 1; min-height: 0; padding: var(--sp-4) var(--sp-1) 0; display: flex; flex-direction: column; gap: var(--sp-2)">
<sc-if value="{{notAccepting}}" hint-placeholder-val="{{false}}">
<div style="flex: none; display: flex; align-items: center; gap: var(--sp-2); height: var(--h-field); padding: 0 var(--sp-3); margin: 0 var(--sp-3); background: var(--card); box-shadow: inset 2px 0 0 var(--gold); font-size: var(--fs-5)">直接の申込を受けていません</div>
</sc-if>
<x-import style="display: contents" component-from-global-scope="KuroobiUI.Section" title="KUROOBI のレーティング">
<div style="display: flex; align-items: center; height: var(--h-field); border-top: 1px solid var(--border-weak); border-bottom: 1px solid var(--border-weak)">
<sc-for list="{{mine}}" as="s" hint-placeholder-count="4">
<div style="flex: 1; min-width: 0; padding: 0 var(--sp-3); border-right: 1px solid var(--border-weak); white-space: nowrap">
<x-import component-from-global-scope="KuroobiUI.KeyValue" label="{{s.label}}" value="{{s.value}}"></x-import>
</div>
</sc-for>
</div>
</x-import>
<x-import style="display: contents" component-from-global-scope="KuroobiUI.Section" title="ボット" aside="{{botCount}}" grow="{{yes}}">
<div style="height: 100%; display: flex; flex-direction: column">
<!-- Columns: rank · name (+ "Built-in" tag) · rating · state · challenge. Only bots that play standard 8x8; KUROOBI's own row is bold and has no button -->
<div style="flex: none; height: var(--h-head); display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-3); border-bottom: 1px solid var(--border)">
<span style="width: 36px; flex: none; font-size: var(--fs-7); font-weight: 600; letter-spacing: .08em; color: var(--sub)">順位</span>
<span style="flex: 1; min-width: 0; font-size: var(--fs-7); font-weight: 600; letter-spacing: .08em; color: var(--sub)">名前</span>
<span style="width: 72px; flex: none; font-size: var(--fs-7); font-weight: 600; letter-spacing: .08em; color: var(--sub); text-align: right">レーティング</span>
<span style="width: 96px; flex: none; font-size: var(--fs-7); font-weight: 600; letter-spacing: .08em; color: var(--sub)">状態</span>
<span style="width: 120px; flex: none"></span>
</div>
<div class="k-scroll" style="flex: 1; min-height: 0; display: flex; flex-direction: column">
<sc-for list="{{bots}}" as="b" hint-placeholder-count="12">
<div style="flex: none; display: flex; align-items: center; gap: var(--sp-2); height: var(--h-field); padding: 0 var(--sp-3); border-bottom: 1px solid var(--border-weak); font-size: var(--fs-5); white-space: nowrap; font-weight: {{b.weight}}">
<span style="width: 36px; flex: none; color: {{b.rankColor}}; font-variant-numeric: tabular-nums">#{{b.rank}}</span>
<!-- FlipSightボット (the site's own, is_builtin) and 登録ボット (registered by users) told apart by an icon before the name -->
<span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--sp-2); overflow: hidden"><span role="img" aria-label="{{b.kind}}" title="{{b.kind}}" style="flex: none; display: grid; place-items: center; color: {{b.kindColor}}"><x-import component-from-global-scope="KuroobiUI.Icon" name="{{b.icon}}" size="{{n15}}"></x-import></span><span class="k-sel" style="overflow: hidden; text-overflow: ellipsis">{{b.name}}</span></span>
<span style="width: 72px; flex: none; text-align: right; font-variant-numeric: tabular-nums">{{b.rate}}</span>
<span style="width: 96px; flex: none; color: {{b.stateColor}}; font-size: var(--fs-6); font-weight: 400">{{b.state}}</span>
<span style="width: 120px; flex: none; display: flex; justify-content: flex-end; align-items: center; gap: var(--sp-2); font-weight: 400">
<sc-if value="{{b.waiting}}" hint-placeholder-val="{{false}}"><span style="font-size: var(--fs-6); color: var(--accent)">申込中 0:42</span></sc-if>
<sc-if value="{{b.canAsk}}" hint-placeholder-val="{{true}}"><x-import component-from-global-scope="KuroobiUI.Button" size="row" variant="secondary" disabled="{{b.askOff}}">申込</x-import></sc-if>
</span>
</div>
</sc-for>
</div>
</div>
</x-import>
</div>
</x-import>
</x-import>
<div style="height: var(--h-status); flex: none; background: var(--bg); border-top: 1px solid var(--border); display: flex; align-items: center; gap: var(--sp-4); padding: 0 var(--sp-4); font-size: var(--fs-6); color: var(--sub); white-space: nowrap">
<span style="margin-left: auto; display: flex; align-items: center; gap: var(--sp-1)">CPU <span aria-hidden="true" style="display: inline-block; width: 32px; height: 4px; border-radius: var(--r-pill); background: var(--track); overflow: hidden"><span style="display: block; height: 100%; width: 1%; background: var(--ok)"></span></span><b style="color: var(--text); font-weight: 600">4</b>%</span>
<span style="display: flex; align-items: center; gap: var(--sp-1)">メモリ <span aria-hidden="true" style="display: inline-block; width: 32px; height: 4px; border-radius: var(--r-pill); background: var(--track); overflow: hidden"><span style="display: block; height: 100%; width: 41%; background: var(--ok)"></span></span><b style="color: var(--text); font-weight: 600">6.5</b> GB</span>
<span>GGS <b style="color: var(--text); font-weight: 600">未接続</b></span>
<span>FlipSight <b style="color: var(--text); font-weight: 600">接続中</b> (2 / 2 体)</span>
</div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accept":{"editor":"select","options":["on","off"],"default":"on"},"challenge":{"editor":"select","options":["none","waiting"],"default":"none"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const ui = window.KuroobiUI;
    if (ui && ui.setLang) ui.setLang('ja');
    const accepting = (this.props.accept ?? 'on') === 'on';
    const waiting = (this.props.challenge ?? 'none') === 'waiting';
    // A bot that is offline or playing cannot take a challenge; one that turned ours down is left alone for a while
    const list = [
      ['atlas', 2711.0, false, 'online'], ['lynx', 2588.3, false, 'playing'], ['KUROOBI', 2463.4, false, 'me'],
      ['nova', 2358.2, false, 'online'], ['orion', 2201.7, false, 'cooling'], ['Level 10', 2016.6, true, 'online'],
      ['vega', 1987.9, false, 'offline'], ['Level 8', 1802.4, true, 'online'], ['zebra', 1755.0, false, 'online'], ['KUROOBI-lite', 1702.6, false, 'online'],
      ['Level 6', 1590.2, true, 'online'], ['Level 4', 1371.8, true, 'online'], ['Level 2', 1105.3, true, 'online'],
    ];
    const STATE = { online: ['オンライン', 'var(--accent)'], playing: ['対局中', 'var(--ok)'], offline: ['オフライン', 'var(--sub)'], cooling: ['辞退された', 'var(--sub)'], me: ['', 'var(--sub)'] };
    const bots = list.map(([name, rate, builtin, st], i) => {
      const w = waiting && name === 'nova';
      return {
        rank: i + 1, rankColor: i === 0 ? 'var(--gold)' : 'var(--sub)',
        name, rate: rate.toFixed(1), builtin,
        icon: builtin ? 'cpu' : 'ggs-users', kind: builtin ? 'FlipSightボット' : '登録ボット', kindColor: builtin ? 'var(--accent)' : 'var(--sub)',
        state: w ? 'オンライン' : STATE[st][0], stateColor: STATE[st][1],
        weight: st === 'me' ? 600 : 400,
        waiting: w, canAsk: st !== 'me' && !w, askOff: st !== 'online' || waiting,
      };
    });
    return {
      yes: true, n15: 15,
      navLocal: ui ? ui.navLocal() : [],
      ggsItems: ui ? ui.ggsNav('offline', {}) : [],
      fsItems: [
        { item: { id: 'fs-play', label: '対局', icon: 'ggs-play' }, on: false },
        { item: { id: 'fs-bots', label: 'ボット', icon: 'ggs-users' }, on: true },
        { item: { id: 'fs-results', label: '結果', icon: 'results' }, on: false },
        { item: { id: 'fs-connect', label: '自分のボット', icon: 'login' }, on: false },
      ],
      notAccepting: !accepting,
      mineOpts: [['KUROOBI', 'KUROOBI'], ['KUROOBI-lite', 'KUROOBI-lite']],
      mineW: 132,
      mine: [
        { label: 'レーティング', value: '2463.4' },
        { label: '順位', value: '#3' },
        { label: '勝 / 負 / 分', value: '167 / 4 / 11' },
        { label: '直近 12 対局の増減', value: '+6.8' },
      ],
      bots, botCount: list.length + ' 体',
    };
  }
}
</script>
</body>
</html>
