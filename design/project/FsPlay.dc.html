<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>FlipSight · Match in progress</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="kuroobi-tokens.css">
<link rel="stylesheet" href="ds/kuroobiui/components/bundle.css">
<script src="ds/kuroobiui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
x-import{display:contents}
@media (max-width:1040px){.k-nav-ov .k-nav-label{display:none}.k-nav-ov .k-nav-row{justify-content:center;padding:0}.k-nav-ov .k-nav-section{display:none}}
.k-scroll{overflow-y:scroll!important}
.k-scroll::-webkit-scrollbar-track{background:var(--track);border-radius:9px}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-4)/1.6 var(--ff)}
a{color:var(--accent)}a:hover{color:var(--text)}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 100vh; min-height: 480px; background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff); overflow: hidden">
<x-import component-from-global-scope="KuroobiUI.BoardDefs"></x-import>
<x-import style="display: contents" component-from-global-scope="KuroobiUI.AppFrame">
<x-import component-from-global-scope="KuroobiUI.WindowBar" title="対局"></x-import>
<x-import style="display: contents" component-from-global-scope="KuroobiUI.Body">
<div style="position: relative; flex: none; display: flex">
<x-import style="display: contents" component-from-global-scope="KuroobiUI.Nav" items="{{navLocal}}" ggs-items="{{ggsItems}}" conn="offline" active="fs-play"></x-import>
<!-- FlipSight section, connected: Matches (count of matches in progress), Bots, Results -->
<div class="k-nav-ov" style="position: absolute; left: 0; right: 1px; top: 216px; padding: 0 var(--sp-2); display: flex; flex-direction: column; gap: 1px">
<div class="k-nav-section" style="margin: var(--sp-4) 0 6px; padding: 0 10px; align-items: center; gap: var(--sp-2); font-size: var(--fs-7); font-weight: 600; letter-spacing: .1em; color: var(--sub)"><x-import component-from-global-scope="KuroobiUI.Dot" tone="ok"></x-import>FlipSight</div>
<sc-for list="{{fsItems}}" as="i" hint-placeholder-count="4">
<x-import component-from-global-scope="KuroobiUI.NavRow" item="{{i.item}}" active="{{i.on}}"></x-import>
</sc-for>
</div>
<div class="k-nav-ov" style="position: absolute; left: 0; right: 1px; bottom: 0; padding: var(--sp-2); border-top: 1px solid var(--border); background: var(--panel)">
<button type="button" class="k-nav-row k-row" aria-current="false" style="width: 100%; height: var(--h-field); display: flex; align-items: center; gap: var(--sp-3); border: 0; border-radius: var(--r-2); font: inherit; font-size: var(--fs-4); background: transparent; color: var(--text); font-weight: 400"><span style="flex: none; display: grid; place-items: center"><x-import component-from-global-scope="KuroobiUI.Icon" name="prefs"></x-import></span><span class="k-nav-label">設定</span></button>
</div>
</div>
<x-import style="display: contents" component-from-global-scope="KuroobiUI.Main">

<!-- The bot plays on its own: no resign or adjourn (the bot API has neither); a finished match opens its record -->
<x-import style="display: contents" component-from-global-scope="KuroobiUI.Toolbar">
<sc-if value="{{hasGames}}" hint-placeholder-val="{{true}}">
<span style="display: flex; align-items: baseline; gap: var(--sp-2); min-width: 0; white-space: nowrap; overflow: hidden">
<b style="font-size: var(--fs-3); font-weight: 600">{{curTitle}}</b>
<span style="font-size: var(--fs-6); color: var(--sub); overflow: hidden; text-overflow: ellipsis">{{curSub}}</span>
</span>
<div style="margin-left: auto; display: flex; align-items: center; gap: var(--sp-2); white-space: nowrap">
<sc-if value="{{isFinished}}" hint-placeholder-val="{{false}}">
<x-import component-from-global-scope="KuroobiUI.Button">棋譜</x-import>
</sc-if>
</div>
</sc-if>
</x-import>

<sc-if value="{{hasGames}}" hint-placeholder-val="{{true}}">
<div style="flex: 1; min-height: 0; display: flex">

<!-- Match list: in progress on top, finished below. Only the bot's own matches (FlipSight has no observing) -->
<div style="flex: none; width: var(--w-list); min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border)">
<div style="flex: none; display: flex; align-items: center; gap: var(--sp-2); height: var(--h-field); padding: 0 var(--sp-2); border-bottom: 1px solid var(--border-weak)">
<x-import component-from-global-scope="KuroobiUI.Segmented" value="all" options="{{listFilter}}" fill="{{yes}}"></x-import>
</div>
<div class="k-scroll" style="flex: 1; min-height: 0; display: flex; flex-direction: column">
<sc-for list="{{matchGroups}}" as="g" hint-placeholder-count="2">
<div style="flex: none; height: var(--h-head); display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); padding: 0 var(--sp-3); font-size: var(--fs-7); font-weight: 600; letter-spacing: .08em; color: var(--sub); white-space: nowrap">{{g.title}}<span style="margin-left: auto; font-weight: 400; letter-spacing: 0">{{g.count}}</span></div>
<sc-for list="{{g.items}}" as="m" hint-placeholder-count="6">
<x-import component-from-global-scope="KuroobiUI.BotMatchRow" name="{{m.name}}" photo="{{m.photo}}" own="{{m.own}}" own-photo="{{m.ownPhoto}}" kind="{{m.kind}}" diff="{{m.diff}}" active="{{m.active}}" on-select="{{noop}}" on-close="{{m.onClose}}"></x-import>
</sc-for>
</sc-for>
</div>
<div style="flex: none; padding: var(--sp-2); border-top: 1px solid var(--border)">
<x-import component-from-global-scope="KuroobiUI.Button" variant="ghost" size="field" class-name="k-wide">{{closeAllLabel}}</x-import>
</div>
</div>

<div style="flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column">
<sc-if value="{{isFinished}}" hint-placeholder-val="{{false}}">
<div style="flex: none; display: flex; align-items: center; gap: var(--sp-3); height: var(--h-field); padding: 0 var(--sp-4); border-bottom: 1px solid var(--border); background: var(--panel); font-size: var(--fs-5); white-space: nowrap">
<x-import component-from-global-scope="KuroobiUI.Tag" tone="sub">終局</x-import>
<b style="font-weight: 600">{{resultHead}}</b>
<span style="color: var(--sub); overflow: hidden; text-overflow: ellipsis">{{resultSub}}</span>
</div>
</sc-if>
<div style="flex: 1; min-height: 0; display: flex">

<!-- A FlipSight match is two boards played at once, colours swapped: the same two columns as a GGS synchro match -->
<sc-for list="{{boards}}" as="b" hint-placeholder-count="2">
<div style="flex: 1; min-width: 0; display: flex; justify-content: center; padding: var(--sp-2) var(--sp-3) 0; border-right: 1px solid var(--border-weak)">
<div style="width: {{boardPx}}; display: flex; flex-direction: column">
<div style="height: var(--h-head); display: flex; align-items: center; gap: var(--sp-3); font-size: var(--fs-7); color: var(--sub); white-space: nowrap">
<span style="font-weight: 600; color: var(--text)">{{b.face}}</span>
<span style="margin-left: auto">{{b.score}} · {{b.ply}}</span>
</div>
<x-import component-from-global-scope="KuroobiUI.PlayerRow" color="{{b.top.color}}" name="{{b.top.name}}" photo="{{b.top.photo}}" rate="{{b.top.rate}}" meta="{{b.top.meta}}" clock="{{b.top.clock}}" active="{{b.top.active}}"></x-import>
<div style="width: {{boardPx}}; height: {{boardPx}}">
<x-import component-from-global-scope="KuroobiUI.Board" cells="{{b.cells}}" last="{{b.last}}" legal="{{b.legal}}" evals="{{b.evals}}" turn="{{b.turn}}" coords="{{yes}}" disabled="{{yes}}"></x-import>
</div>
<x-import component-from-global-scope="KuroobiUI.PlayerRow" color="{{b.bottom.color}}" name="{{b.bottom.name}}" photo="{{b.bottom.photo}}" rate="{{b.bottom.rate}}" meta="{{b.bottom.meta}}" clock="{{b.bottom.clock}}" active="{{b.bottom.active}}"></x-import>
<div style="height: var(--h-row); display: flex; align-items: center; font-size: var(--fs-6); color: {{b.stateColor}}; white-space: nowrap">{{b.state}}</div>
</div>
</div>
</sc-for>
</div>

<div style="flex: none; padding: var(--sp-2) var(--sp-4) var(--sp-2); border-top: 1px solid var(--border)">
<x-import component-from-global-scope="KuroobiUI.EvalTrend" points="{{trend}}" plies="{{plies}}" height="{{trendH}}" title="{{trendTitle}}" names="{{trendNames}}"></x-import>
</div>
</div>
</div>
</sc-if>

<!-- No match: what the bot is doing until the next one starts (waiting for challenges, or a challenge of its own out) -->
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div style="flex: 1; min-height: 0; display: grid; place-items: center; padding: var(--sp-5)">
<div style="display: flex; align-items: center; gap: var(--sp-5)">
<div style="flex: none; width: 160px; height: 160px; opacity: .6"><x-import component-from-global-scope="KuroobiUI.EmptyBoard"></x-import></div>
<div style="display: flex; flex-direction: column; gap: var(--sp-2); max-width: 320px">
<span style="font-size: var(--fs-3); font-weight: 600">{{empty.title}}</span>
<sc-for list="{{empty.lines}}" as="l" hint-placeholder-count="1">
<span style="font-size: var(--fs-5); color: var(--text); line-height: 1.8">{{l}}</span>
</sc-for>
<span style="font-size: var(--fs-5); color: var(--sub); line-height: 1.8; text-wrap: balance">{{empty.body}}</span>
<div style="display: flex; gap: var(--sp-2); margin-top: var(--sp-2)">
<x-import component-from-global-scope="KuroobiUI.Button" variant="primary">ボットを見る</x-import>
</div>
</div>
</div>
</div>
</sc-if>
</x-import>
</x-import>
<div style="height: var(--h-status); flex: none; background: var(--bg); border-top: 1px solid var(--border); display: flex; align-items: center; gap: var(--sp-4); padding: 0 var(--sp-4); font-size: var(--fs-6); color: var(--sub); white-space: nowrap">
<sc-if value="{{hasLive}}" hint-placeholder-val="{{true}}">
<span style="display: flex; align-items: center; gap: var(--sp-1)"><x-import component-from-global-scope="KuroobiUI.Dot" tone="accent"></x-import>思考中 <b style="color: var(--text); font-weight: 600">1.7</b> 秒</span>
<span>ノード <b style="color: var(--text); font-weight: 600">1,463 万</b></span>
<span>速度 <b style="color: var(--text); font-weight: 600">1.9</b> Mnps</span>
</sc-if>
<span style="margin-left: auto; display: flex; align-items: center; gap: var(--sp-1)">CPU <span aria-hidden="true" style="display: inline-block; width: 32px; height: 4px; border-radius: var(--r-pill); background: var(--track); overflow: hidden"><span style="display: block; height: 100%; width: {{cpuW}}; background: {{cpuColor}}"></span></span><b style="color: var(--text); font-weight: 600">{{cpu}}</b>%</span>
<span style="display: flex; align-items: center; gap: var(--sp-1)">メモリ <span aria-hidden="true" style="display: inline-block; width: 32px; height: 4px; border-radius: var(--r-pill); background: var(--track); overflow: hidden"><span style="display: block; height: 100%; width: 41%; background: var(--ok)"></span></span><b style="color: var(--text); font-weight: 600">6.5</b> GB</span>
<span>GGS <b style="color: var(--text); font-weight: 600">未接続</b></span>
<span>FlipSight <b style="color: var(--text); font-weight: 600">接続中</b> ({{fsCount}})</span>
</div>
<x-import component-from-global-scope="KuroobiUI.Toasts" items="{{toasts}}" on-dismiss="{{noop}}"></x-import>
</x-import>
</div>
</x-dc>
