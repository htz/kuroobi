<!-- @dsCard group="Forms" height=260 -->
<div id="root" style="padding: var(--sp-4); background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
KuroobiUI.setLang('ja');
const h = React.createElement;
const noop = () => {};
const cap = (label, ...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-1)', minWidth: 0 } },
  h('div', { style: { fontSize: 'var(--fs-7)', color: 'var(--sub)' } }, label), ...kids);
const stack = (...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-4)' } }, ...kids);
const render = (el) => ReactDOM.createRoot(document.getElementById('root')).render(el);
const { Field, TextField } = KuroobiUI;
function Demo() {
  const [name, setName] = React.useState('');
  return h('div', { style: { maxWidth: 320, display: 'flex', flexDirection: 'column', gap: 'var(--sp-3)' } },
    h(Field, { label: 'ログイン名' }, h(TextField, { value: name, onChange: setName, placeholder: '2〜8 文字の英数字' })),
    h(Field, { label: 'パスワード' }, h(TextField, { value: 'secret', onChange: noop, password: true })),
    h(Field, { label: 'アドレス', help: 'ホスト:ポート の形で書く' }, h(TextField, { value: 'skatgame.net:5000', onChange: noop, mono: true })));
}
render(h(Demo));
</script>
