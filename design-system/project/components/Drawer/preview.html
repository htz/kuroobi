<!-- @dsCard group="Layout" height=420 -->
<div id="root" style="height: 100vh; background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
KuroobiUI.setLang('ja');
const h = React.createElement;
const noop = () => {};
const render = (el) => ReactDOM.createRoot(document.getElementById('root')).render(el);
const { Drawer, Segmented, Tag, KeyValue, Button } = KuroobiUI;
const rows = ['ymatioun', 'saio', 'Rhapsody', 'scorpion', 'alice', 'OO7', 'fly', 'scorp+'];
render(h('div', { style: { padding: 'var(--sp-4)' } },
  h('div', { style: { fontSize: 'var(--fs-7)', color: 'var(--sub)', marginBottom: 'var(--sp-2)' } }, 'List (stays visible under the drawer)'),
  ...rows.map((n, i) => h('div', { key: n, style: { height: 'var(--h-field)', display: 'flex', alignItems: 'center', padding: '0 var(--sp-3)', borderBottom: '1px solid var(--border-weak)', background: i === 1 ? 'var(--card)' : 'transparent', boxShadow: i === 1 ? 'inset 2px 0 0 var(--accent)' : 'none' } }, n)),
  h(Drawer, { label: '対局の詳細', onClose: noop,
    title: [h(Tag, { key: 't', tone: 'ok' }, '勝'), h('span', { key: 'n' }, 'saio'), h('span', { key: 'd', style: { color: 'var(--ok)' } }, '+6')] },
    h('div', { className: 'k-scroll', style: { flex: 1, minHeight: 0 } },
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-3)', padding: 'var(--sp-4)' } },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-1)' } },
          h(KeyValue, { label: '相手のレート', value: '2003.6' }),
          h(KeyValue, { label: '形式', value: '通常・ランダム16手 · レート戦' }),
          h(KeyValue, { label: '日時', value: '10/26 21:15' })),
        h('div', { style: { display: 'flex', gap: 'var(--sp-2)' } },
          h(Button, { variant: 'primary' }, '棋譜を開く'), h(Button, null, '同じ条件で再戦')))))));
</script>
