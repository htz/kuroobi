<!-- @dsCard group="Layout" height=250 -->
<div id="root" style="padding: var(--sp-4); background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
  KuroobiUI.setLang('ja');
  const h = React.createElement;
  const { Empty, Section } = KuroobiUI;
  const col = (children) => h('div', { style: { width: 'var(--w-dock)', paddingTop: 'var(--sp-2)', background: 'var(--panel)',
                                                  border: '1px solid var(--border)', borderRadius: 'var(--r-3)' } }, children);
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'flex', gap: 'var(--sp-4)', flexWrap: 'wrap', alignItems: 'flex-start' } },
      // When a Section has no content: a single line where the list would be
      col(h(Section, { title: '棋譜' }, h(Empty, null, 'まだ手がありません。'))),
      col(h(Section, { title: '大きく損した手' }, h(Empty, null, 'この対局に大きく損した手はありません。'))),
      // Centred in the chat panel (placed in a margin:auto box)
      h('div', { style: { width: 320, height: 200, display: 'flex', flexDirection: 'column',
                          border: '1px solid var(--border)', borderRadius: 'var(--r-3)' } },
        h('span', { style: { margin: 'auto' } }, h(Empty, null, 'まだ発言はありません。')))));
</script>
