<!-- @dsCard group="Lists" height=150 -->
<div id="root" style="padding: var(--sp-4); background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
KuroobiUI.setLang('ja');
const h = React.createElement;
const noop = () => {};
const cap = (label, ...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-1)', minWidth: 0 } },
  h('div', { style: { fontSize: 'var(--fs-7)', color: 'var(--sub)' } }, label), ...kids);
const { RateRow } = KuroobiUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  cap('My rating (per game type)',
    h('div', { style: { maxWidth: 460, display: 'flex', flexDirection: 'column', gap: 'var(--sp-3)' } },
      h(RateRow, { label: '通常', rate: { value: 2041.9, dev: 38, rank: 7, w: 214, l: 131, d: 9 } }),
      h(RateRow, { label: 'ランダム開局', rate: { value: 1887.3, dev: 112, w: 11, l: 6, d: 1, provisional: true } }))));
</script>
