<!-- @dsCard group="Display" height=194 -->
<div id="root" style="padding: var(--sp-4); background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
  KuroobiUI.setLang('ja');
  const h = React.createElement;
  const noop = () => {};
  const Case = ({ label, children }) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-1)' } },
    h('div', { style: { fontSize: 'var(--fs-7)', color: 'var(--sub)' } }, label), children);
  const Row = (...kids) => h('div', { style: { display: 'flex', alignItems: 'center', gap: 'var(--sp-2)', flexWrap: 'wrap' } }, ...kids);
  const Stack = (...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-4)' } }, ...kids);
  const render = (el) => ReactDOM.createRoot(document.getElementById('root')).render(el);
  const { StoneDot } = KuroobiUI;
  const big = { fontWeight: 600 };
  render(Stack(
    h(Case, { label: 'Default (9px, beside a player name)' }, Row(
      h('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 'var(--sp-0)' } }, h(StoneDot, { color: 'b' }), 'htz'),
      h('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 'var(--sp-0)' } }, h(StoneDot, { color: 'w' }), 'kbcli'))),
    h(Case, { label: 'size 11 (game record viewer)' }, Row(h(StoneDot, { color: 'b', size: 11 }), h(StoneDot, { color: 'w', size: 11 }))),
    h(Case, { label: 'size 13 (disc counts in the game-over dialog)' }, Row(
      h(StoneDot, { color: 'b', size: 13 }), h('b', { style: big }, '34'),
      h('span', { style: { color: 'var(--sub)' } }, '–'),
      h('b', { style: big }, '30'), h(StoneDot, { color: 'w', size: 13 })))));
</script>
