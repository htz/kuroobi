<script>
KuroobiUI.setLang('ja');
const h = React.createElement;
const noop = () => {};
const cap = (label, ...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-1)', minWidth: 0 } },
  h('div', { style: { fontSize: 'var(--fs-7)', color: 'var(--sub)' } }, label), ...kids);

const PTS = [null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,{"value":-2.4},{"value":-1.7},{"value":-0.8},{"value":-1.6},{"value":-0.4},{"value":-1.1},{"value":0.6},{"value":-0.3},{"value":1.2},{"value":0.4},{"value":1.8},{"value":2.1},{"value":9.1},{"value":8.4},{"value":9.6},{"value":8.8},{"value":10.2},{"value":9.5},{"value":10.8},{"value":10.1},{"value":10,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true},{"value":12,"exact":true}].map((p) => p ?? undefined);

        h('span', { style: { width: 72 } }, h(Progress, { value: 41 / 61 }))) }));
}
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-4)' } },
    h(Analyzing),
    wrap('Not analysed yet',
      h(EvalGraph, { points: [], plies: 60, cursor: 0, open: true, onJump: noop, moveName, extra: null }))));
