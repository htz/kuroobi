<!-- @dsCard group="Data" height=190 -->
<div id="root" style="padding: var(--sp-4); background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
KuroobiUI.setLang('ja');
const h = React.createElement;
const { BotPhoto } = KuroobiUI;
const pic = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="hsl(200 45% 42%)"/><circle cx="32" cy="32" r="15" fill="#fff"/></svg>');
const cap = (label, ...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-1)' } },
  h('div', { style: { fontSize: 'var(--fs-7)', color: 'var(--sub)' } }, label), h('div', { style: { display: 'flex', alignItems: 'center', gap: 'var(--sp-3)' } }, ...kids));
const SIZES = [14, 20, 22, 24, 28, 32, 48];
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-3)' } },
  cap('14 / 20 / 22 / 24 / 28 / 32 / 48', ...SIZES.map((s) => h(BotPhoto, { key: s, src: pic, name: 'atlas', size: s }))),
  cap('No picture, or one that does not load: the first letter', ...SIZES.map((s) => h(BotPhoto, { key: s, src: null, name: 'vega', size: s })))));
</script>
