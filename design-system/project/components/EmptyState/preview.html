<!-- @dsCard group="Layout" height=770 -->
<div id="root" style="padding: var(--sp-4); background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
  KuroobiUI.setLang('ja');
  const h = React.createElement;
  const { EmptyState, EmptyBoard, Button } = KuroobiUI;
  // EmptyState fills the rest of the screen with flex: 1 and centres its content. The sample puts it in a box with a height
  const pane = (height, child) => h('div', { style: { height, display: 'flex', flexDirection: 'column',
                                                       border: '1px solid var(--border)', borderRadius: 'var(--r-3)' } }, child);
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-3)' } },
      // Default: app icon + vertical stack, centred + actions below
      pane(290, h(EmptyState, {
        title: '定石がありません',
        body: '定石ファイルを読み込めていません。設定から場所を指定できます。',
        actions: h(Button, { size: 'field', variant: 'primary' }, '設定を開く'),
      })),
      // With visual: horizontal row, left-aligned, actions below the text
      pane(240, h(EmptyState, {
        title: '進行中の対局はありません',
        visual: h(EmptyBoard),
        body: '申し込むか、ロビーで観戦する対局を選ぶとここに出ます',
        actions: h(React.Fragment, null,
          h(Button, { variant: 'primary' }, '対局を申し込む'),
          h(Button, null, 'ロビーで探す')),
      })),
      // Heading only
      pane(170, h(EmptyState, { title: 'GGS に接続していません' }))));
</script>
