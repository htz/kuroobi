<!-- @dsCard group="Forms" height=232 -->
<div id="root" style="padding: var(--sp-4); background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
  KuroobiUI.setLang('ja');
  const h = React.createElement;
  const noop = () => {};
  const Case = ({ label, children }) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-1)' } },
    h('div', { style: { fontSize: 'var(--fs-7)', color: 'var(--sub)' } }, label), children);
  const Row = (...kids) => h('div', { style: { display: 'flex', alignItems: 'center', gap: 'var(--sp-2)', flexWrap: 'wrap' } }, ...kids);
  const Stack = (...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-4)' } }, ...kids);
  const render = (el) => ReactDOM.createRoot(document.getElementById('root')).render(el);
  const { Select } = KuroobiUI;
  const gtypes = [['s8r14', '同期・ランダム14手'], ['s8r16', '同期・ランダム16手'], ['s8', '同期・通常開局'], ['8', '通常']];
  const clocks = [['00:01:00', '1 分'], ['00:05:00', '5 分'], ['00:10:00', '10 分'], ['00:30:00', '30 分']];
  function Demo(props) {
    const [v, setV] = React.useState(props.init);
    return h(Select, { ...props, value: v, onChange: setV });
  }
  render(Stack(
    h(Case, { label: 'size=field (default, match request)' }, Row(
      h(Demo, { init: 's8r14', options: gtypes, title: '形式' }),
      h(Demo, { init: '00:05:00', options: clocks, title: '持ち時間' }))),
    h(Case, { label: 'size=ctrl + width (toolbar KUROOBI plays)' }, Row(
      h(Demo, { init: 'white', size: 'ctrl', width: 116, title: 'KUROOBI の担当',
        options: [['black', '黒'], ['white', '白'], ['both', '両方'], ['off', '担当なし']] }))),
    h(Case, { label: 'Long labels are truncated (max-width 100%)' }, h('div', { style: { width: 150 } },
      h(Demo, { init: 's8r16', options: gtypes })))));
</script>
