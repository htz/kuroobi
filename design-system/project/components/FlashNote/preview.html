<!-- @dsCard group="Display" height=140 -->
<div id="root" style="padding: var(--sp-4); background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
KuroobiUI.setLang('ja');
const h = React.createElement;
const noop = () => {};
const cap = (label, ...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-1)', minWidth: 0 } },
  h('div', { style: { fontSize: 'var(--fs-7)', color: 'var(--sub)' } }, label), ...kids);
const stack = (...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-4)' } }, ...kids);
const render = (el) => ReactDOM.createRoot(document.getElementById('root')).render(el);
const { FlashNote, useFlash, Button } = KuroobiUI;
function Demo() {
  const [note, flash] = useFlash();
  return h('div', { style: { display: 'flex', alignItems: 'center', gap: 'var(--sp-2)' } },
    h(Button, { onClick: () => flash('コピーしました') }, 'コピー'),
    h(Button, { onClick: () => flash('送れませんでした', true) }, '失敗させる'),
    h(FlashNote, { note }));
}
render(stack(cap('Click to show it for 2.5 seconds', h(Demo)), cap('Frozen samples', h('div', { style: { display: 'flex', gap: 'var(--sp-4)' } },
  h(FlashNote, { note: { text: 'コピーしました', bad: false } }), h(FlashNote, { note: { text: '送れませんでした', bad: true } })))));
</script>
