<!-- @dsCard group="Layout" height=820 -->
<div id="root" style="padding: var(--sp-4); background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
  KuroobiUI.setLang('ja');
  const h = React.createElement;
  const { Body, Main, Toolbar, Dock, Section, KeyValue, Empty, Button, Segmented, Strength, Toggle, KifuTable } = KuroobiUI;
  const noop = () => {};
  const moves = [
    { n: 1, move: 'f5', color: 'b', score: 0, src: 'book', secs: 0 },
    { n: 2, move: 'd6', color: 'w', score: 0, src: 'book', secs: 0 },
    { n: 3, move: 'c3', color: 'b', score: 1.2, src: 'search', secs: 2.4 },
    { n: 4, move: 'd3', color: 'w', score: 0.8, src: 'search', secs: 3.1 },
    { n: 5, move: 'c4', color: 'b', score: 1.5, src: 'search', secs: 1.9 },
    { n: 6, move: 'f4', color: 'w', score: -0.4, loss: 1.9, src: 'search', secs: 4.0 },
    { n: 7, move: 'f6', color: 'b', score: 2.1, src: 'search', secs: 2.2 },
    { n: 8, move: 'f3', color: 'w', score: 1.0, src: 'search', secs: 3.5 },
  ];
  // The right Dock. In windows wider than 1120px it is always shown; at 1120px or less it overlays the right edge of Body only when open
  // (toggled by the button at the right end of the Toolbar). Its position is relative to Body (position:relative), so the sample also places it in Body next to Main.
  // Every screen has one tab, so no tab strip is shown
  function Scene({ height, scroll, body }) {
    const [open, setOpen] = React.useState(true);
    return h('div', { style: { height, display: 'flex', flexDirection: 'column',
                               border: '1px solid var(--border)', borderRadius: 'var(--r-3)', overflow: 'hidden' } },
      h(Body, null,
        h(Main, { inset: open },
          h(Toolbar, { dock: { open, onToggle: () => setOpen((o) => !o) } },
            h(Button, { variant: 'primary' }, '対局開始')),
          h('div', { style: { flex: 1 } })),
        h(Dock, { tabs: [{ id: 'main', label: '' }], active: 'main', open, scroll }, body())));
  }
  // The play/study Dock (PlayDock): scroll=false keeps the strength on top fixed and scrolls only the game record below
  function Play() {
    const [by, setBy] = React.useState('level');
    const [levels, setLevels] = React.useState({ depth: 12, solve: 16 });
    const [book, setBook] = React.useState(true);
    return h(React.Fragment, null,
      h('div', { style: { flex: 'none', paddingTop: 'var(--sp-3)', borderBottom: '1px solid var(--border)' } },
        h(Section, { title: '強さ' },
          h(Segmented, { fill: true, value: by, onChange: setBy,
                         options: [{ value: 'level', label: 'レベル' }, { value: 'clock', label: '持ち時間' }] }),
          by === 'level'
            ? h(Strength, { value: levels, onChange: setLevels })
            : h(React.Fragment, null,
                h(KeyValue, { label: '黒 · 自分', value: '7:48', big: true }),
                h(KeyValue, { label: '白 · KUROOBI', value: '8:31', big: true })),
          h(Toggle, { checked: book, onChange: setBook, label: '定石' }))),
      h('div', { style: { flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column' } },
        h(KifuTable, { moves, current: 8, decimals: 1, onSelect: noop })),
      h('div', { style: { flex: 'none', display: 'flex', gap: 'var(--sp-2)', padding: 'var(--sp-2) var(--sp-3)',
                          borderTop: '1px solid var(--border-weak)' } },
        h(Button, { title: '⌘O' }, '貼り付け'), h(Button, null, '読込'), h(Button, { title: '⌘S' }, '保存')));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-4)' } },
      h(Scene, { height: 460, scroll: false, body: () => h(Play) }),
      // The book tab Dock (BookDock): "This position" and "Next move"
      h(Scene, { height: 300, scroll: true,
                 body: () => h(React.Fragment, null,
                   h(Section, { title: 'この局面', aside: h('span', null, '2 手') },
                     h('div', { style: { fontSize: 'var(--fs-6)', color: 'var(--sub)' } }, 'f5 d6'),
                     h(KeyValue, { label: '出所', value: 'book.txt' })),
                   h(Section, { title: '次の手' }, h(Empty, null, 'この局面から先は定石にありません。'))) })));
</script>
