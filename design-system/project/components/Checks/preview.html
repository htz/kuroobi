<!-- @dsCard group="Actions" height=200 -->
<div id="root" style="padding: var(--sp-4); background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
  KuroobiUI.setLang('ja');
  const h = React.createElement;
  const Case = ({ label, children }) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-1)' } },
    h('div', { style: { fontSize: 'var(--fs-7)', color: 'var(--sub)' } }, label), children);
  const Stack = (...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-4)' } }, ...kids);
  const render = (el) => ReactDOM.createRoot(document.getElementById('root')).render(el);
  const { Checks } = KuroobiUI;
  const kinds = [{ value: 's8r', label: 'シンクロ・ランダム' }, { value: '8r', label: 'ランダム' }, { value: 's8', label: 'シンクロ' }, { value: '8', label: '通常' }];
  function Demo(props) {
    const [v, setV] = React.useState(props.init);
    return h(Checks, { ...props, values: v, onChange: setV });
  }
  render(Stack(
    h(Case, { label: 'Basic (tournament kinds)' }, h(Demo, { init: ['s8r'], options: kinds })),
    h(Case, { label: 'Wrapping in a narrow column' }, h('div', { style: { width: 260 } }, h(Demo, { init: ['s8r', '8'], options: kinds }))),
    h(Case, { label: 'disabled' }, h(Checks, { values: ['s8r'], disabled: true, options: kinds }))));
</script>
