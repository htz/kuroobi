<!-- @dsCard group="Lists" height=250 -->
<div id="root" style="padding: var(--sp-4); background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
KuroobiUI.setLang('ja');
const h = React.createElement;
const noop = () => {};
const cap = (label, ...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-1)', minWidth: 0 } },
  h('div', { style: { fontSize: 'var(--fs-7)', color: 'var(--sub)' } }, label), ...kids);
const { ResultHead, ResultRow, List } = KuroobiUI;
const box = (label, ...el) => cap(label, h('div', { style: { maxWidth: 560 } }, ...el));
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-4)' } },
    box('With note and rating (type "All", with rating records)',
      h(ResultHead, { note: true, rating: true }),
      h(List, null,
        h(ResultRow, { win: true, opponent: 'ymatioun', discs: 12, when: '14:22', note: '同期・ランダム14手', rating: 2041.9, onClick: noop }),
        h(ResultRow, { win: false, opponent: 'saio', discs: -6, when: '10/25', note: '通常', rating: 2035.2, onClick: noop }))),
    box('Without note and rating (narrowed to one type, no rating records)',
      h(ResultHead, null),
      h(List, null,
        h(ResultRow, { win: true, opponent: 'kbcli', discs: 20, when: '10/24', onClick: noop })))));
</script>
