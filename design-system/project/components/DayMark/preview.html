<div id="root" style="padding: var(--sp-4); background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
  KuroobiUI.setLang('ja');
  const h = React.createElement;
  const { DayMark, Bubble } = KuroobiUI;
  // One per date change, inside the same column as the chat (gap sp-3)
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { maxWidth: 520, display: 'flex', flexDirection: 'column', gap: 'var(--sp-3)' } },
      h(DayMark, null, '10月25日(土)'),
      h(Bubble, { showName: true, m: { from: 'kbcli', at: '23:41', body: 'see you tomorrow' } }),
      h(DayMark, null, '10月26日(日)'),
      h(Bubble, { showName: true, m: { from: 'htz', mine: true, at: '09:12', body: 'good morning, ready for the tourney?' } })));
</script>
