<!-- @dsCard group="Forms" height=1120 -->
<div id="root" style="padding: var(--sp-4); background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
  KuroobiUI.setLang('ja');
  const h = React.createElement;
  const noop = () => {};
  const Case = ({ label, children }) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-1)' } },
    h('div', { style: { fontSize: 'var(--fs-7)', color: 'var(--sub)' } }, label), children);
  const Row = (...kids) => h('div', { style: { display: 'flex', alignItems: 'center', gap: 'var(--sp-2)', flexWrap: 'wrap' } }, ...kids);
  const Stack = (...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-4)' } }, ...kids);
  const render = (el) => ReactDOM.createRoot(document.getElementById('root')).render(el);
  const { FormulaEditor } = KuroobiUI;
  const atom = (name, op = '=', val = '', neg = false) => ({ kind: 'atom', name, op, val, neg });
  function Demo({ init }) {
    const [v, setV] = React.useState(init);
    return h(FormulaEditor, { value: v, onChange: setV, onClear: () => setV(null), onSave: noop, onRaw: noop });
  }
  render(h('div', { style: { maxWidth: 480 } }, Stack(
    h(Case, { label: 'Not set (value=null)' }, h(Demo, { init: null })),
    h(Case, { label: 'Set (with a nested bundle)' }, h(Demo, { init: { kind: 'all', kids: [
      atom('rated'),
      atom('or', '≥', '1800'),
      { kind: 'any', kids: [atom('rand'), atom('synchro')] },
    ] } })),
    h(Case, { label: 'Negated bundle, functions, item-to-item comparison, formula row' }, h(Demo, { init: { kind: 'any', kids: [
      { kind: 'any', neg: true, kids: [atom('rated'), atom('rand')] },
      atom('mt1', '<', 'ot1'),
      { ...atom('md', '≤', '0.0'), arg: '+1.0' },
      { ...atom('playing', '>', '0'), arg: 'both' },
      { ...atom('rnd', '<', '50'), arg: '100' },
      { kind: 'expr', src: 'mr>or+100.0' },
    ] } })))));
</script>
