<!-- @dsCard group="Lists" height=160 -->
<div id="root" style="padding: var(--sp-4); background: var(--bg); color: var(--text); font: var(--fs-4)/1.6 var(--ff);"></div>
<script>
KuroobiUI.setLang('ja');
const h = React.createElement;
const noop = () => {};
const cap = (label, ...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-1)', minWidth: 0 } },
  h('div', { style: { fontSize: 'var(--fs-7)', color: 'var(--sub)' } }, label), ...kids);
const stack = (...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--sp-4)' } }, ...kids);
const render = (el) => ReactDOM.createRoot(document.getElementById('root')).render(el);
const { ListRow, TwoLines, Tag } = KuroobiUI;
render(stack(
  cap('Name + note (content of row2)', h('div', { style: { maxWidth: 320, display: 'flex', flexDirection: 'column' } },
    h(ListRow, { height: 'row2', on: true, onClick: noop },
      h(TwoLines, { top: [h('b', { key: 'n', style: { fontWeight: 600 } }, 'Autumn Cup'), h(Tag, { key: 't', tone: 'ok' }, '進行中')], bottom: '5 回戦 · 8 人 · 残り 12 分' })),
    h(ListRow, { height: 'row2', onClick: noop },
      h(TwoLines, { top: h('b', { style: { fontWeight: 600 } }, 'ask'), bottom: '対局を申し込む (tell /os ask 形式 時間 相手)' }))))));
</script>
