<circle cx="351" cy="74" r="8" fill="#1f2328" stroke="#c8d0d8"/>
<text x="368" y="78" font-size="13" font-weight="700" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, monospace">black: u64</text>
<text x="368" y="98" font-size="12" fill="#59636e" font-family="ui-monospace, SFMono-Regular, monospace">0x0000000810000000</text>
<text x="368" y="116" font-size="11.5" fill="#59636e">1 where a black disc sits</text>
<circle cx="351" cy="148" r="8" fill="#ffffff" stroke="#c8d0d8"/>
<text x="368" y="152" font-size="13" font-weight="700" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, monospace">white: u64</text>
<text x="368" y="172" font-size="12" fill="#59636e" font-family="ui-monospace, SFMono-Regular, monospace">0x0000001008000000</text>
<text x="368" y="190" font-size="11.5" fill="#59636e">1 where a white disc sits</text>
<text x="342" y="232" font-size="11.5" fill="#59636e">empties = !(black | white). No square is ever set in both.</text>
<text x="342" y="249" font-size="11.5" fill="#59636e"></text>
<text x="342" y="266" font-size="11.5" fill="#59636e">One bit per square, so flipping discs and counting legal moves become</text>
<text x="342" y="283" font-size="11.5" fill="#59636e">plain bit operations. All 8 directions advance at once (a Kogge-Stone</text>
<text x="342" y="300" font-size="11.5" fill="#59636e">style doubling smear), so no loop is needed.</text>
<text x="342" y="317" font-size="11.5" fill="#59636e"></text>
<text x="342" y="334" font-size="11.5" fill="#59636e">file-major is used because a vertical smear is then a 1-bit shift;</text>
<text x="342" y="351" font-size="11.5" fill="#59636e">rank-major would make it an 8-bit shift.</text>
</svg>