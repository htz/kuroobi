<svg xmlns="http://www.w3.org/2000/svg" width="900" height="249" viewBox="0 0 900 249" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif">
<rect width="900" height="249" fill="#ffffff"/>
<text x="24" y="32" font-size="15" font-weight="700" fill="#1f2328">Choosing one move on a clock — one search from the book to the solve</text>
<text x="24" y="52" font-size="11.5" fill="#59636e">Where each part takes over is decided by the time left, not by a fixed number of empties</text>
<rect x="24.0" y="76" width="220.0" height="46" fill="#ffd479" opacity="0.85" rx="3"/>
<text x="134.0" y="105" font-size="12.5" font-weight="700" fill="#7a5b12" text-anchor="middle">Opening book</text>
<rect x="244.0" y="76" width="392.0" height="46" fill="#4d9fff" opacity="0.85" rx="3"/>
<text x="440.0" y="105" font-size="12.5" font-weight="700" fill="#0b3f7a" text-anchor="middle">Search on a clock</text>
<rect x="636.0" y="76" width="240.0" height="46" fill="#ef7a7a" opacity="0.85" rx="3"/>
<text x="756.0" y="105" font-size="12.5" font-weight="700" fill="#7a1f1f" text-anchor="middle">Exact solve</text>
<line x1="24" y1="128" x2="876" y2="128" stroke="#d0d7de"/>
<line x1="24.0" y1="125" x2="24.0" y2="132" stroke="#d0d7de"/>
<text x="24.0" y="146" font-size="10.5" fill="#59636e" text-anchor="start">← Opening (60 empties)</text>
<line x1="876.0" y1="125" x2="876.0" y2="132" stroke="#d0d7de"/>
<text x="876.0" y="146" font-size="10.5" fill="#59636e" text-anchor="end">Game over (0 empties) →</text>
<rect x="24" y="160" width="11" height="11" rx="2" fill="#ffd479"/>
<text x="42" y="169" font-size="11" font-weight="600" fill="#1f2328">Opening book</text>
<text x="152" y="169" font-size="11" fill="#59636e">While the position is in book, answers instantly without searching</text>
<rect x="24" y="179" width="11" height="11" rx="2" fill="#4d9fff"/>
<text x="42" y="188" font-size="11" font-weight="600" fill="#1f2328">Search on a clock</text>
<text x="152" y="188" font-size="11" fill="#59636e">NNUE eval + PVS + ProbCut, two plies deeper per pass; at full depth, a wider ProbCut margin per pass</text>
<rect x="24" y="198" width="11" height="11" rx="2" fill="#ef7a7a"/>
<text x="42" y="207" font-size="11" font-weight="600" fill="#1f2328">Exact solve</text>
<text x="152" y="207" font-size="11" fill="#59636e">Once the widest margin is done: to the end without pruning, within the same move's time</text>
<text x="24" y="232" font-size="10.5" fill="#59636e">Without a clock (fixed levels, analysis) the midgame search runs to the level's depth and the solve starts at its empties.</text>
</svg>
