<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif">
<rect width="900" height="372" fill="#ffffff"/>
<text x="24" y="32" font-size="15" font-weight="700" fill="#1f2328">Flipping discs — all 8 directions advance at once (Kogge-Stone style doubling smear)</text>
<text x="24" y="52" font-size="11.5" fill="#59636e">The figure shows one direction (rightward). In reality all 8 run in parallel in one chain of bit operations, so no per-direction loop is needed</text>
