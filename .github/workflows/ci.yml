name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 依存の取得を速く・安定させる
  CARGO_INCREMENTAL: 0

jobs:
  engine:
    name: エンジン (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust ツールチェイン
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 書式
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      # 学習済みの重み (weights/) は容量の都合で git に入れていない。
      # それを要するテストは #[ignore] 済みなので、ここでは走らない。
      - name: テスト
        run: cargo test --release

      - name: feature の組み合わせをビルド
        run: |
          cargo build --release --features node-accounting
          cargo build --release --features layer-profile
          cargo build --release --features nnue-scalar

  gui-ui:
    name: 対局 GUI のフロント (型検査 / lint / ビルド)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: 依存の取得
        run: npm ci

      # 型検査に加えて eslint も走る (npm run check の中身)。
      # React の hooks 依存や DOM の直接操作は、目で見ても取りこぼす。
      - name: 型検査と lint
        run: npm run check

      - name: ビルド
        run: npm run build

  gui-app:
    name: 対局 GUI のアプリ (fmt / clippy / test / ビルド)
    runs-on: macos-latest
    needs: gui-ui
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: フロントをビルド (Tauri が読む ui/ を作る)
        working-directory: gui
        run: |
          npm ci
          npm run build

      # gui/ はルートとは別のクレート。ルートの job で回した fmt / clippy /
      # test はこちらを見ない。ここで回さないと、不要キャストのような
      # 指摘が素通りする (実際に 1 つ紛れたことがある)。
      - name: 書式
        working-directory: gui
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: gui
        run: cargo clippy --all-targets -- -D warnings

      - name: テスト
        working-directory: gui
        run: cargo test --release

      - name: アプリをビルド
        working-directory: gui
        run: cargo build --release
