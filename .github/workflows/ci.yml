name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Faster, more reproducible dependency fetches
  CARGO_INCREMENTAL: 0

jobs:
  engine:
    name: Engine (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      # Trained weights (weights/) are out of git for size; the tests
      # needing them are #[ignore]d, so they do not run here.
      - name: Test
        run: cargo test --release

      - name: Build feature combinations
        run: |
          cargo build --release --features node-accounting
          cargo build --release --features layer-profile
          cargo build --release --features nnue-scalar

  gui-ui:
    name: GUI frontend (typecheck / lint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # npm run check is typecheck plus eslint: React hook deps and
      # direct DOM access slip past review by eye.
      - name: Typecheck and lint
        run: npm run check

      - name: Build
        run: npm run build

  gui-app:
    name: GUI app (fmt / clippy / test / build)
    runs-on: macos-latest
    needs: gui-ui
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Build the frontend (produces the ui/ Tauri embeds)
        working-directory: gui
        run: |
          npm ci
          npm run build

      # gui/ is a separate crate: the root job's fmt / clippy / test
      # never reach it. Without this step lints like a needless cast
      # sail through (one did).
      - name: Format
        working-directory: gui
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: gui
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: gui
        run: cargo test --release

      - name: Build the app
        working-directory: gui
        run: cargo build --release
