name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Faster, more reproducible dependency fetches
  CARGO_INCREMENTAL: 0

jobs:
  engine:
    name: Engine (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      # Trained weights (weights/) are out of git for size; the tests
      # needing them are #[ignore]d, so they do not run here.
      - name: Test
        run: cargo test --release

      - name: Build feature combinations
        run: |
          cargo build --release --features nnue-scalar

  # crates/web is outside default-members (nnue-web would shrink every
  # binary built with it), so the root job never reaches it.
  web-engine:
    name: Kuroobi for web engine (clippy / test / wasm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/web
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1-threads
      - uses: Swatinem/rust-cache@v2

      - name: clippy (native)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (wasm)
        run: |
          cargo clippy --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --target wasm32-wasip1-threads -- -D warnings

      - name: Test
        run: cargo test --release

      - name: Build kuroobi_ai.wasm
        run: |
          cargo build --release --target wasm32-unknown-unknown
          cargo build --release --target wasm32-wasip1-threads

  site:
    name: Site (typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

  gui-ui:
    name: GUI frontend (typecheck / lint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/gui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # npm run check is typecheck plus eslint: React hook deps and
      # direct DOM access slip past review by eye.
      - name: Typecheck and lint
        run: npm run check

      - name: Build
        run: npm run build

  gui-app:
    name: GUI app (fmt / clippy / test / build)
    runs-on: macos-latest
    needs: gui-ui
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json

      - name: Build the frontend (produces the ui/ Tauri embeds)
        working-directory: crates/gui
        run: |
          npm ci
          npm run build

      # The GUI is outside default-members: the root job's clippy and
      # test never reach it.
      - name: clippy
        working-directory: crates/gui
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: crates/gui
        run: cargo test --release

      - name: Build the app
        working-directory: crates/gui
        run: cargo build --release
